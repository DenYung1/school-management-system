<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - JIT NIIT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
        <section class="card shadow-sm border-0" style="width: 100%; max-width: 450px;">
            <div class="card-body p-4 p-md-5">
                <h1 class="h3 text-primary mb-2">Reset your password</h1>
                <p class="text-muted mb-4">Choose a new password for your account.</p>
                <div id="resetMessage" class="alert d-none" role="alert"></div>
                <form id="resetPasswordForm">
                    <div class="mb-3">
                        <label for="newPassword" class="form-label">New password</label>
                        <input type="password" class="form-control" id="newPassword" minlength="6" required>
                    </div>
                    <div class="mb-4">
                        <label for="confirmPassword" class="form-label">Confirm password</label>
                        <input type="password" class="form-control" id="confirmPassword" minlength="6" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Update password</button>
                </form>
                <a class="d-block text-center mt-4" href="index.html">Back to login</a>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.0.0/dist/umd/supabase.min.js"></script>
    <script src="js/config.js"></script>
    <script>
        const form = document.getElementById('resetPasswordForm');
        const message = document.getElementById('resetMessage');

        function showMessage(text, type) {
            message.textContent = text;
            message.className = `alert alert-${type}`;
        }

        form.addEventListener('submit', async function(event) {
            event.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const submitButton = form.querySelector('button[type="submit"]');

            if (newPassword !== confirmPassword) {
                showMessage('Passwords do not match.', 'danger');
                return;
            }

            submitButton.disabled = true;
            try {
                const { error } = await supabaseClient.auth.updateUser({ password: newPassword });
                if (error) throw error;
                form.reset();
                showMessage('Password updated successfully. You can now log in.', 'success');
            } catch (error) {
                showMessage(error.message || 'Unable to update your password.', 'danger');
            } finally {
                submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
